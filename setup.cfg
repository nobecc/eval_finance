[metadata]
name = eval-finance
version = 0.1.0
description = Harness-independent finance benchmark scoring
long_description = file: README.md
long_description_content_type = text/markdown

[options]
python_requires = >=3.10
install_requires =
    PyYAML>=6
package_dir =
    eval_finance = .
packages =
    eval_finance
    eval_finance.benchmarks
    eval_finance.examples
    eval_finance.benchmarks.dataclawbench
    eval_finance.benchmarks.ddr_10k
    eval_finance.benchmarks.finance_agent_bench_v1_1
    eval_finance.benchmarks.finance_agent_bench_v2
    eval_finance.benchmarks.finance_complex_qa
    eval_finance.benchmarks.finfirst
    eval_finance.benchmarks.finsearchcomp_t2
    eval_finance.benchmarks.finsearchcomp_t3
    eval_finance.benchmarks.frontier_finance
    eval_finance.benchmarks.generic

[options.package_data]
eval_finance =
    config.yaml
    benchmarks/*/config.yaml
    CASE_SCHEMA.md
    REWARD_SCHEMA.md
    examples/*.json
    examples/*.yaml

[options.entry_points]
console_scripts =
    eval-finance = eval_finance.cli:main
